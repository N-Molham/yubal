[project]
name = "yubal"
version = "0.10.0"
description = "Self-hosted YouTube Music downloader and library manager"
dependencies = [
  "ytmusicapi>=1.12.2",
  "pydantic>=2.0.0",
  "yt-dlp==2026.8.18.122307.dev0",
  "pathvalidate>=3.2.0",
  "rapidfuzz>=3.0.0",
  "mediafile>=0.12.0",
  "httpx>=0.27.0",
  "unidecode>=1.3.0",
]
# Note: yt-dlp can use a `deno` binary on PATH to solve YouTube's EJS
# anti-bot challenges (see utils/_jsruntime.py's plain PATH-based lookup —
# no Python import required). Not a pip dependency here — the API image's
# entrypoint.sh fetches the raw binary into a persistent volume at first
# boot instead, since it's an 80MB+ static binary bigger than most of this
# package's actual dependencies combined.

[project.urls]
Homepage = "https://github.com/guillevc/yubal"
Repository = "https://github.com/guillevc/yubal"
Issues = "https://github.com/guillevc/yubal/issues"

[project.optional-dependencies]
cli = ["typer>=0.21.1", "rich>=13.0.0"]

[project.scripts]
yubal = "yubal.cli:app"

[build-system]
requires = ["uv_build>=0.9.23,<0.12.0"]
build-backend = "uv_build"
